<!doctype html>
<html lang="id">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dewa Billiard - Babak Knock Out</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --billiard-green: #0b5e2e;
        --billiard-light: #1a8c47;
        --billiard-dark: #062d17;
        --gold: #ffd700;
        --white: #ffffff;
      }

      * {
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(
          135deg,
          var(--billiard-dark) 0%,
          var(--billiard-green) 100%
        );
        color: #333;
        min-height: 100vh;
      }

      /* Navbar */
      .navbar {
        background: linear-gradient(
          90deg,
          var(--billiard-dark) 0%,
          var(--billiard-green) 100%
        );
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        padding: 1rem 1rem;
      }

      .navbar-brand {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--gold) !important;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .navbar-brand i {
        font-size: 2rem;
      }

      .nav-link {
        color: var(--white) !important;
        margin: 0 0.5rem;
        font-weight: 600;
        transition: all 0.3s ease;
        border-radius: 0.5rem;
      }

      .nav-link:hover {
        background-color: var(--gold);
        color: var(--billiard-dark) !important;
      }

      .nav-link.active {
        background-color: var(--gold);
        color: var(--billiard-dark) !important;
      }

      /* Main Container */
      .container-main {
        padding: 2rem 1rem;
        min-height: calc(100vh - 100px);
      }

      /* Page Title */
      .page-title {
        color: var(--white);
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 2rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      /* Bracket Container */
      .bracket-container {
        background: var(--white);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      .round-title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--billiard-dark);
        margin-bottom: 2rem;
        padding: 0.8rem 1.5rem;
        background: linear-gradient(
          135deg,
          rgba(255, 215, 0, 0.1),
          rgba(255, 165, 0, 0.1)
        );
        border-radius: 0.8rem;
        border: 2px solid var(--gold);
      }

      /* Match Card */
      .knockout-match {
        background: linear-gradient(135deg, #f8f9fa 0%, var(--white) 100%);
        border-radius: 0.8rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-left: 4px solid var(--billiard-green);
        border-top: 3px solid var(--gold);
      }

      .knockout-match:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        transform: translateY(-3px);
      }

      .match-number {
        display: inline-block;
        background: linear-gradient(
          135deg,
          var(--billiard-green),
          var(--billiard-light)
        );
        color: var(--white);
        padding: 0.4rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .knockout-players {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .knockout-player {
        flex: 1;
        text-align: center;
        padding: 1rem;
        border-radius: 0.6rem;
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
        font-weight: 600;
        color: var(--billiard-dark);
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .knockout-player:hover {
        background: linear-gradient(135deg, #c8e6c9, #dcedc8);
      }

      .knockout-player .seed {
        display: block;
        font-size: 0.75rem;
        color: #666;
        margin-bottom: 0.3rem;
        font-weight: 400;
      }

      .vs-badge {
        background: var(--billiard-green);
        color: var(--white);
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
      }

      .match-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
        padding-top: 0.8rem;
        border-top: 1px solid #e9ecef;
      }

      .match-date {
        background: var(--billiard-green);
        color: var(--white);
        padding: 0.4rem 0.8rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.8rem;
      }

      .match-status {
        display: inline-block;
        background: var(--gold);
        color: var(--billiard-dark);
        padding: 0.3rem 0.8rem;
        border-radius: 0.5rem;
        font-size: 0.8rem;
        font-weight: 700;
      }

      /* Footer */
      .footer {
        background: var(--billiard-dark);
        color: var(--white);
        text-align: center;
        padding: 2rem;
        margin-top: 3rem;
        border-top: 3px solid var(--gold);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .page-title {
          font-size: 1.8rem;
        }

        .knockout-players {
          flex-direction: column;
          gap: 0.5rem;
        }

        .vs-badge {
          width: 2rem;
          height: 2rem;
          font-size: 0.8rem;
        }

        .knockout-player {
          font-size: 0.9rem;
          padding: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-lg px-0 px-lg-3">
        <a class="navbar-brand" href="../">
          <i class="fas fa-circle"></i>
          Dewa Billiard
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link px-3" href="../index.html">
                <i class="fas fa-trophy"></i> Klasemen
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" href="../index.html#jadwal">
                <i class="fas fa-calendar"></i> Jadwal
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3 active" href="./">
                <i class="fas fa-bolt"></i> Knock Out
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container-lg container-main">
      <div class="row mb-4">
        <div class="col-12">
          <div class="page-title">
            <i class="fas fa-bolt"></i>
            Babak Knock Out
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="bracket-container">
            <div class="round-title">
              <i class="fas fa-fire"></i> Perempat Final (Quarter Finals)
            </div>

            <div id="knockout-matches"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer"><i class="fas fa-circle"></i> Dewa Billiard 2026</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="knockout.js"></script>

    <script>
      // Format Date
      function formatDate(dateStr) {
        if (!dateStr) return "Belum ditentukan";
        const date = new Date(dateStr);
        const options = {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        };
        return date.toLocaleDateString("id-ID", options);
      }

      // Get Match Status
      function getMatchStatus(match) {
        if (match.winner) return "Selesai";
        if (!match.date) return "Menunggu";
        const matchDate = new Date(match.date);
        const now = new Date();
        if (matchDate > now) return "Mendatang";
        return "Berlangsung";
      }

      // Render Knockout Matches
      function renderKnockout() {
        const container = document.getElementById("knockout-matches");
        let html = "";

        knockoutMatches.forEach((match) => {
          const status = getMatchStatus(match);
          const isWinner1 = match.winner === match.player_1;
          const isWinner2 = match.winner === match.player_2;

          html += `
            <div class="knockout-match">
              <div class="match-number">
                <i class="fas fa-gamepad"></i> Pertandingan ${match.match}
              </div>
              <div class="knockout-players">
                <div class="knockout-player ${isWinner1 ? "winner" : ""}">
                  <span class="seed">${match.seed_1}</span>
                  ${match.player_1}
                  ${isWinner1 ? '<div style="margin-top:0.3rem;"><span style="background:var(--gold);color:var(--billiard-dark);padding:0.2rem 0.5rem;border-radius:0.3rem;font-size:0.7rem;font-weight:700;"><i class="fas fa-crown"></i> Pemenang</span></div>' : ""}
                </div>
                <div class="vs-badge">VS</div>
                <div class="knockout-player ${isWinner2 ? "winner" : ""}">
                  <span class="seed">${match.seed_2}</span>
                  ${match.player_2}
                  ${isWinner2 ? '<div style="margin-top:0.3rem;"><span style="background:var(--gold);color:var(--billiard-dark);padding:0.2rem 0.5rem;border-radius:0.3rem;font-size:0.7rem;font-weight:700;"><i class="fas fa-crown"></i> Pemenang</span></div>' : ""}
                </div>
              </div>
              <div class="match-info">
                <div class="match-date">
                  <i class="fas fa-clock"></i> ${formatDate(match.date)}
                </div>
                <span class="match-status">${status}</span>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", function () {
        renderKnockout();
      });
    </script>
  </body>
</html>
